name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Locate Project and Build APK
      run: |
        # settings.gradle ফাইলটি কোন ফোল্ডারে আছে তা খুঁজে বের করা
        SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
        
        if [ -n "$SETTINGS_FILE" ]; then
          TARGET_DIR=$(dirname "$SETTINGS_FILE")
          echo "Project found in directory: $TARGET_DIR"
          cd "$TARGET_DIR"
        else
          echo "No settings.gradle found, building in root"
        fi

        # gradlew থাকলে তা দিয়ে চালাবে, নাহলে সিস্টেম gradle দিয়ে চালাবে
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
